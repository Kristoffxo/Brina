<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brina — listening</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='16' r='7' fill='none' stroke='%237C8B7A' stroke-width='2'/%3E%3Ccircle cx='20' cy='16' r='7' fill='none' stroke='%237C8B7A' stroke-width='2'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body class="app-body">

<!-- ── Sign in ─────────────────────────────────────────────── -->
<div class="signin" id="signin" hidden>
  <form class="signin-card" id="signin-form">
    <h1>Listening</h1>
    <p class="signin-note" id="config-warning" hidden>
      <strong>Not connected.</strong> Add your Supabase URL and anon key to
      <code>config.js</code> first.
    </p>

    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username" required>

    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>

    <button type="submit" class="btn" id="signin-btn">Sign in</button>
    <p class="signin-error" id="signin-error" hidden></p>
  </form>
</div>

<!-- ── Console ─────────────────────────────────────────────── -->
<div class="console" id="console" hidden>

  <aside class="console-side">
    <div class="console-side-head">
      <div class="wordmark">
        <svg class="wordmark-mark" viewBox="0 0 32 22" aria-hidden="true" focusable="false">
          <circle cx="12" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
          <circle cx="20" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
        </svg>
        <span>Brina</span>
      </div>
      <button type="button" class="text-btn" id="signout-btn">Sign out</button>
    </div>

    <div class="availability">
      <label class="switch">
        <input type="checkbox" id="available-toggle">
        <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
        <span id="available-label">Not available</span>
      </label>
      <label class="visually-hidden" for="availability-note">Status note</label>
      <input type="text" id="availability-note" maxlength="60"
             placeholder="Optional note, e.g. back at 9pm">
    </div>

    <p class="console-count" id="count">No conversations</p>
    <ul class="convo-list" id="convo-list"></ul>
  </aside>

  <section class="console-main">
    <div class="console-empty" id="console-empty">
      <p>Pick a conversation on the left.</p>
      <p class="console-empty-small">New ones appear on their own. Nothing needs refreshing.</p>
    </div>

    <div class="console-thread-wrap" id="thread-wrap" hidden>
      <header class="console-thread-head">
        <div>
          <span class="convo-id" id="open-id"></span>
          <span class="convo-meta" id="open-meta"></span>
        </div>
        <button type="button" class="text-btn text-btn-warn" id="delete-btn">Delete conversation</button>
      </header>

      <div class="thread thread-listener-view" id="thread" aria-live="polite"></div>

      <form class="composer" id="composer" autocomplete="off">
        <label class="visually-hidden" for="reply">Your reply</label>
        <textarea id="reply" rows="1" placeholder="Write back&hellip;" maxlength="4000"></textarea>
        <button type="submit" class="btn" id="reply-btn">Send</button>
      </form>
    </div>
  </section>

</div>

<script src="config.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
